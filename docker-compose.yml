services:
  api:
    build:
      context: .
      dockerfile: Backend/OrderManagement.Api/Dockerfile
    container_name: oms-api
    env_file:
      - .env
    environment:
      # Override the .env value: inside the container the db lives on the mounted volume.
      DB_CONNECTION_STRING: "Data Source=/data/app.db"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      # Persist the SQLite database between container restarts
      - sqlite-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: oms-frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  sqlite-data:
